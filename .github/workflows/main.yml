name: Update JSON from Google Sheet

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-player-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
      - name: Check Google Sheets CSV for changes
        id: snapshot
        run: |
          curl --fail --show-error --location --retry 2 --max-time 30 'https://docs.google.com/spreadsheets/d/1iZXbs8q7ma2zqLW9T2onMA9uamn-TpfbLO_v73GyjaU/export?format=csv&gid=0' -o data.csv
          if [[ -f .world-json-source.sha256 ]] && sha256sum --check --status --strict .world-json-source.sha256; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'CSV, converter and published JSON match the last successful snapshot.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v4
        if: steps.snapshot.outputs.changed == 'true'
        with:
          python-version: "3.11"
      - name: Validate and convert CSV
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          python3 -m unittest test_convert.py
          python3 convert.py
      - name: Publish the validated snapshot and its checksums together
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          sha256sum data.csv convert.py data.json > .world-json-source.sha256
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data.json .world-json-source.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'auto: update JSON from Google Sheets'
            git push origin "HEAD:$GITHUB_REF"
          fi
